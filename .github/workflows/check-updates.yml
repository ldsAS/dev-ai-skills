name: Check AI Tools Updates

on:
  schedule:
    # UTC 01:15（約台灣時間 09:15）
    # ⚠️ GitHub 的排程本來就不保證準點，可能延後數十分鐘至數小時，尤其是免費 runner。
    #    選非整點只能略為降低排隊機率，無法消除延遲 — 這是預期行為，不必當成故障。
    - cron: '15 1 * * *'
  workflow_dispatch: # 允許在 Actions 頁面手動觸發，適合驗證與測試

permissions:
  contents: write
  issues: write
  copilot-requests: write # Copilot CLI 用內建 github.token 認證，不需要 PAT

# 避免手動觸發與排程同時執行時，兩邊都要 push 基準線而打架
concurrency:
  group: check-updates
  cancel-in-progress: false

jobs:
  check-and-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # 之後 push 衝突時要 rebase，淺 clone 會失敗

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Run check script
        id: check
        run: |
          set +e
          python scripts/check_updates.py > report.md 2> stderr.txt
          exit_code=$?
          set -e

          # 腳本本身炸掉（網路全斷、語法錯誤⋯⋯）也必須告警，
          # 不能像舊版那樣靜默地報「無異動」然後亮綠燈。
          if [ "$exit_code" -ne 0 ]; then
            {
              echo
              echo "## ❌ 檢查腳本以非 0 狀態結束 (exit $exit_code)"
              echo
              echo '```'
              tail -c 3000 stderr.txt
              echo '```'
            } >> report.md
          fi

          cat report.md
          python scripts/monitor_ci_policy.py analyze \
            --report report.md \
            --exit-code "$exit_code" \
            --github-output "$GITHUB_OUTPUT"

      # AI 只負責「摘要」，不參與偵測。偵測結論一律由上一步的規則式比對決定，
      # 這樣「今天為什麼沒告警」永遠可以靠 tests/ 重現。本步驟壞掉不影響告警。
      - name: Summarize report with Copilot
        id: summarize
        if: always() && steps.check.outcome == 'success' # PROBE: 暫時放寬，驗證後還原
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PRIMARY_MODEL: gpt-5.6-terra
        run: |
          npm install -g @github/copilot

          # 報告裡已含 claims_for_token() 比對出的主張，模型不必再翻 57KB 的
          # CLAIMS.md，因此不開放任何檔案工具 — 輸入面確定，成本可預期。
          {
            echo "以下是一份自動化監控報告。請用 3 至 5 句繁體中文說明：本次偵測到哪些變動、"
            echo "可能影響哪幾條已登記的主張、建議優先確認什麼。"
            echo "只根據報告內容陳述，不要臆測報告未提及的事，也不要建議修改程式碼。"
            echo
            echo "--- 報告開始 ---"
            head -c 20000 report.md
          } > prompt.txt

          # 依序嘗試：指定模型 → Auto → CLI 預設。
          # 單一模型下架是最可能的失效原因，退回 Auto 可免去每次模型汰換都要改這個檔案；
          # 最後不帶 --model 再試一次，是為了扛住旗標名稱本身變動的情況。
          summarize_with() {
            if [ -n "$1" ]; then
              timeout 300 copilot --yolo --model "$1" -p "$(cat prompt.txt)"
            else
              timeout 300 copilot --yolo -p "$(cat prompt.txt)"
            fi
          }

          for model in "$PRIMARY_MODEL" "Auto" ""; do
            label="${model:-CLI 預設}"
            if summarize_with "$model" > ai-summary.txt 2> ai-error.txt && [ -s ai-summary.txt ]; then
              echo "摘要由 $label 產生"
              exit 0
            fi
            echo "::warning::模型 $label 未能產生摘要"
            tail -c 500 ai-error.txt || true
            rm -f ai-summary.txt
          done

          exit 1

      - name: Prepend summary to report
        if: always() && steps.check.outcome == 'success' # PROBE: 暫時放寬，驗證後還原
        continue-on-error: true
        run: |
          {
            if [ -s ai-summary.txt ]; then
              echo "> 🤖 以下摘要由 AI 生成，僅供快速理解。"
              echo "> 判斷依據以下方規則式比對結果為準。"
              echo ">"
              sed 's/^/> /' ai-summary.txt
            else
              # 靜默降級正是這個 repo 要避免的失效模式（見 check_updates.py 開頭註解）。
              # 摘要壞掉必須出現在必然會被讀到的 Issue 裡，而不是只躺在 Actions log。
              echo "> ⚠️ 本次 AI 摘要產生失敗（指定模型可能已下架，或額度不足）。"
              echo "> 以下僅為規則式報告；偵測本身不受影響。"
            fi
            echo
            cat report.md
          } > report-with-summary.md
          mv report-with-summary.md report.md

      # PROBE: 暫時步驟，驗證後刪除
      - name: PROBE show merged report
        if: always()
        run: |
          echo "----- report.md 前 60 行 -----"
          head -n 60 report.md

      - name: Notify via GitHub Issues
        if: >-
          always() && steps.check.outcome == 'success' &&
          (steps.check.outputs.updates == 'true' || steps.check.outputs.failure == 'true')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ISSUE_KINDS: ${{ steps.check.outputs.issue_kinds }}
        run: |
          {
            echo
            echo "---"
            echo "由 [check-updates.yml]($RUN_URL) 於 $(date -u '+%Y-%m-%d %H:%M UTC') 產生。"
            echo
            echo "CC: @$OWNER"
          } >> report.md

          gh issue list --state open --limit 1000 --json number,title,state > open-issues.json

          # updates 與 failure 是獨立狀態；同時發生時兩類 issue 都必須收到報告。
          for kind in $ISSUE_KINDS; do
            case "$kind" in
              update) TITLE="🚨 偵測到 AI 工具路徑與機制異動" ;;
              failure) TITLE="⚠️ AI 工具異動檢查失敗" ;;
              *) echo "::error::未知的 issue 類型：$kind"; exit 1 ;;
            esac

            python scripts/monitor_ci_policy.py targets \
              --issues open-issues.json --title "$TITLE" > matching-issues.txt
            EXISTING=$(head -n 1 matching-issues.txt)

            if [ -n "$EXISTING" ]; then
              gh issue comment "$EXISTING" --body-file report.md
              echo "已在既有 issue #$EXISTING 追加留言"
            else
              gh issue create --title "$TITLE" --body-file report.md --assignee "$OWNER"
            fi
          done

      - name: Close recovered failure Issues
        if: >-
          always() && steps.check.outcome == 'success' &&
          steps.check.outputs.failure != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FAILURE_TITLE: "⚠️ AI 工具異動檢查失敗"
        run: |
          gh issue list --state open --limit 1000 --json number,title,state > open-issues.json
          python scripts/monitor_ci_policy.py targets \
            --issues open-issues.json --title "$FAILURE_TITLE" > recovery-targets.txt

          while IFS= read -r issue; do
            [ -n "$issue" ] || continue
            gh issue comment "$issue" --body "✅ 自動檢查已恢復正常。恢復時間：$(date -u '+%Y-%m-%d %H:%M UTC')；本次執行：$RUN_URL"
            gh issue close "$issue"
            echo "已留下恢復紀錄並關閉 issue #$issue"
          done < recovery-targets.txt

      - name: Commit baseline update
        if: false # PROBE: 暫時停用，避免探測跑把基準線 commit 推到分支
        run: |
          if git diff --quiet -- scripts/last_checked.json; then
            echo "基準線內容無實際變更，略過 commit"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/last_checked.json
          git commit -m "chore: 更新 AI 工具路徑基準線 [skip ci]"

          # 期間若有其他 push 進來，rebase 後重試，不要直接失敗
          for attempt in 1 2 3; do
            if git push; then
              echo "基準線已推送（第 $attempt 次嘗試）"
              exit 0
            fi
            echo "push 失敗，rebase 後重試⋯⋯"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          done

          echo "::error::基準線連續 3 次 push 失敗"
          exit 1

      - name: Fail workflow when checks failed
        if: always() && steps.check.outputs.should_fail == 'true'
        run: |
          echo "::error::一個或多個監控來源檢查失敗；通知與必要的 baseline 處理已完成。"
          exit 1
