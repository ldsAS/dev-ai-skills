name: Check AI Tools Updates

on:
  schedule:
    # UTC 01:15（約台灣時間 09:15）
    # ⚠️ GitHub 的排程本來就不保證準點，實測常延後 30–60 分鐘，尤其是免費 runner。
    #    選非整點只能略為降低排隊機率，無法消除延遲 — 這是預期行為，不必當成故障。
    - cron: '15 1 * * *'
  workflow_dispatch: # 允許在 Actions 頁面手動觸發，適合驗證與測試

permissions:
  contents: write
  issues: write

# 避免手動觸發與排程同時執行時，兩邊都要 push 基準線而打架
concurrency:
  group: check-updates
  cancel-in-progress: false

jobs:
  check-and-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 之後 push 衝突時要 rebase，淺 clone 會失敗

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run check script
        id: check
        run: |
          set +e
          python scripts/check_updates.py > report.md 2> stderr.txt
          exit_code=$?
          set -e

          cat report.md

          updates=false
          failure=false
          baseline=false
          if grep -q '\[SIGNAL: UPDATE_DETECTED\]' report.md; then updates=true; fi
          if grep -q '\[SIGNAL: CHECK_FAILED\]' report.md; then failure=true; fi
          if grep -q '\[SIGNAL: BASELINE_CHANGED\]' report.md; then baseline=true; fi

          # 腳本本身炸掉（網路全斷、語法錯誤⋯⋯）也必須告警，
          # 不能像舊版那樣靜默地報「無異動」然後亮綠燈。
          if [ "$exit_code" -ne 0 ]; then
            failure=true
            {
              echo
              echo "## ❌ 檢查腳本以非 0 狀態結束 (exit $exit_code)"
              echo
              echo '```'
              tail -c 3000 stderr.txt
              echo '```'
            } >> report.md
          fi

          {
            echo "updates=$updates"
            echo "failure=$failure"
            echo "baseline=$baseline"
          } >> "$GITHUB_OUTPUT"

      - name: Notify via GitHub Issue
        if: steps.check.outputs.updates == 'true' || steps.check.outputs.failure == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "${{ steps.check.outputs.updates }}" = "true" ]; then
            TITLE="🚨 偵測到 AI 工具路徑與機制異動"
          else
            TITLE="⚠️ AI 工具異動檢查失敗"
          fi

          {
            echo
            echo "---"
            echo "由 [check-updates.yml]($RUN_URL) 於 $(date -u '+%Y-%m-%d %H:%M UTC') 產生。"
            echo
            echo "CC: @$OWNER"
          } >> report.md

          # 同類型的告警只維持一張 issue，後續異動改用留言追加，
          # 避免每天開一張新的把 issue 列表淹掉。
          EXISTING=$(TITLE="$TITLE" gh issue list --state open --limit 100 \
            --json number,title --jq 'map(select(.title == env.TITLE)) | .[0].number // empty')

          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body-file report.md
            echo "已在既有 issue #$EXISTING 追加留言"
          else
            gh issue create --title "$TITLE" --body-file report.md --assignee "$OWNER"
          fi

      - name: Commit baseline update
        if: steps.check.outputs.baseline == 'true'
        run: |
          if git diff --quiet -- scripts/last_checked.json; then
            echo "基準線內容無實際變更，略過 commit"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/last_checked.json
          git commit -m "chore: 更新 AI 工具路徑基準線 [skip ci]"

          # 期間若有其他 push 進來，rebase 後重試，不要直接失敗
          for attempt in 1 2 3; do
            if git push; then
              echo "基準線已推送（第 $attempt 次嘗試）"
              exit 0
            fi
            echo "push 失敗，rebase 後重試⋯⋯"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          done

          echo "::error::基準線連續 3 次 push 失敗"
          exit 1
